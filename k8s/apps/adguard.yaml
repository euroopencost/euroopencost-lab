apiVersion: v1
kind: Namespace
metadata:
  name: adguard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adguard-config-pvc
  namespace: adguard
spec:
  storageClassName: local-path
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard-home
  namespace: adguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adguard-home
  template:
    metadata:
      labels:
        app: adguard-home
    spec:
      containers:
      - name: adguard-home
        image: adguard/adguardhome:latest
        ports:
        - containerPort: 80
        - containerPort: 3000
        volumeMounts:
        - name: adguard-config
          mountPath: /opt/adguardhome/conf
      volumes:
      - name: adguard-config
        persistentVolumeClaim:
          claimName: adguard-config-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: adguard-home
  namespace: adguard
spec:
  selector:
    app: adguard-home
  ports:
    - name: http
      port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: adguard-ingress
  namespace: adguard
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`dns.${DOMAIN}`)
      kind: Rule
      services:
        - name: adguard-home
          port: 80
  tls:
    secretName: wildcard-tls-secret