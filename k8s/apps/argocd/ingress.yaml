apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server-route
  namespace: argocd
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`argocd.${DOMAIN}`)
      kind: Rule
      services:
        - name: argocd-server
          port: 80
  tls:
    secretName: wildcard-tls-secret