apiVersion: v1
kind: Namespace
metadata:
  name: homepage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: EuroOpenCost-Lab
    base: https://home.${DOMAIN}
  services.yaml: |
    - Infrastruktur:
        - AdGuard:
            icon: adguard-home.png
            href: https://dns.${DOMAIN}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      containers:
      - name: homepage
        image: ghcr.io/gethomepage/homepage:latest
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: config
          mountPath: /app/config
      volumes:
      - name: config
        configMap:
          name: homepage-config
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homepage-route
  namespace: homepage
spec:
  entryPoints: [websecure]
  routes:
  - match: Host(`home.${DOMAIN}`)
    kind: Rule
    services:
    - name: homepage-service
      port: 3000
  tls:
    secretName: wildcard-tls-secret